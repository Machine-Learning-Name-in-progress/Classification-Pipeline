[project]
name = "classification-pipeline"
version = "0.1.0"
description = "Classification pipeline built on top of mlnip-lib"
readme = "readme.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mlnip-lib>=1.0.2",
    "numpy",
    "pandas>=3.1.0",
    "matplotlib",
    "kagglehub>=1.0.3",
]

[project.urls]
Source = "https://github.com/Machine-Learning-Name-in-progress/Classification-Pipeline"

[dependency-groups]
dev = [
    "ipykernel",
    "commitizen",
]

[tool.uv]
# Notebook project, not an installable package
package = false

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
